services:
  postgres:
    image: postgres:16-alpine
    container_name: trizen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trizen
      POSTGRES_PASSWORD: trizen
      POSTGRES_DB: trizen
    ports:
      - "5432:5432"
    volumes:
      - trizen_pg_data:/var/data

volumes:
  trizen_pg_data:
